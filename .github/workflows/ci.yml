name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run check

      - name: Run linter
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Build production workers
        run: |
          npm run build:api
          npm run build:web
